const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "ornament": "cellar-key",

// ── API client ────────────────────────────────────────────────
window.QS_API = (() => {
  const base = (window.location.origin || '') + '/api/v1';
  const j = async (res) => {
    const body = await res.json().catch(() => ({}));
    if (!res.ok && res.status !== 202) {
      const err = new Error(body?.error?.message || body?.detail?.message || 'Request failed');
      err.status = res.status;
      err.body = body;
      throw err;
    }
    return body;
  };
  return {
    trending: () => fetch(base + '/trending').then(j),
    startTasting: (repoUrl) => fetch(base + '/tastings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ repo_url: repoUrl, ref: 'main' }),
    }).then(j),
    pollTasting: (jobId) => fetch(base + '/tastings/' + jobId).then(j),
    corkPngUrl: (jobId) => base + '/tastings/' + jobId + '/cork.png',
  };
})();

// Normalize API tasting into the shape the JSX components expect.
window.normalizeTasting = (t) => {
  if (!t) return null;
  const eduFor = (f) => {
    const byLib = f.library && window.FINDING_LIBRARY_EDU[f.library];
    const byAlg = f.algorithm && window.FINDING_EDU[f.algorithm.toUpperCase().replace(/[- ]/g, '')];
    const byCat = f.category && window.FINDING_CATEGORY_EDU[f.category];
    return byLib || byAlg || byCat || {
      what: f.rule_description || "The scanner flagged this pattern for sommelier review.",
      why_pqc: "Any cryptographic primitive requires a post-quantum audit: if it's classical RSA/ECC/DH, it's on the migration list. If it's a hash, Grover cuts the bit-strength in half. If it's symmetric with a 128-bit key, the margin is narrow but intact.",
      remediation: "Consult the NIST PQC migration guide (NIST IR 8547). Inventory every usage site, triage by confidentiality horizon, schedule replacement with ML-KEM / ML-DSA / SLH-DSA as appropriate."
    };
  };
  const normFindings = (t.findings || []).map((f) => {
    const edu = eduFor(f);
    return {
      ...f,
      short: f.short || f.rule_description || f.id,
      file: f.file || f.file_path || '',
      lines: f.lines || (f.line_start && f.line_end ? (f.line_start === f.line_end ? String(f.line_start) : `${f.line_start}-${f.line_end}`) : ''),
      snippet: f.snippet || f.code_snippet || '',
      what: f.what || edu.what,
      why_pqc: f.why_pqc || edu.why_pqc,
      remediation: f.remediation || edu.remediation,
    };
  });
  return {
    ...t,
    repo: { ...t.repo, language: t.repo.primary_language || t.repo.language || 'unknown' },
    palate: { paragraphs: (t.palate && t.palate.prose) || [] },
    finish: { prose: ((t.finish && t.finish.prose) || []).join('\n\n') },
    findings: normFindings,
  };
};

function App() {
  const persisted = React.useMemo(() => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
  }, []);
  const [tweaks, setTweaks] = React.useState({ ...TWEAK_DEFAULTS, ...(persisted.tweaks || {}) });
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [view, setView] = React.useState('landing'); // landing | scanning | tasting
  const [repoSlug, setRepoSlug] = React.useState('');
  const [jobId, setJobId] = React.useState(null);
  const [tasting, setTasting] = React.useState(null);
  const [rateLimitMsg, setRateLimitMsg] = React.useState(null);
  const [drawerFinding, setDrawerFinding] = React.useState(null);
  const [corkOpen, setCorkOpen] = React.useState(false);

  React.useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ tweaks }));
  }, [tweaks]);

  React.useEffect(() => {
    document.body.dataset.temp = tweaks.temp;
    document.body.dataset.wordmark = tweaks.wordmark;
  }, [tweaks.temp, tweaks.wordmark]);

  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const startScan = async (slugOrUrl) => {
    setRateLimitMsg(null);
    const repoUrl = /^https?:\/\//.test(slugOrUrl)
      ? slugOrUrl
      : `https://github.com/${slugOrUrl}`;
    setRepoSlug(slugOrUrl);
    setTasting(null);
    setView('scanning');
    window.scrollTo({ top: 0, behavior: 'instant' });
    try {
      const { job_id } = await window.QS_API.startTasting(repoUrl);
      setJobId(job_id);
    } catch (err) {
      if (err.status === 429) {
        setRateLimitMsg(err.body?.error?.message || "The cellar is shut — too many tastings this hour.");
        setView('landing');
      } else {
        setRateLimitMsg(err.body?.detail?.message || err.message || 'Could not start tasting.');
        setView('landing');
      }
    }
  };

  const finishScan = (apiTasting) => {
    setTasting(window.normalizeTasting(apiTasting));
    setView('tasting');
    window.scrollTo({ top: 0, behavior: 'instant' });
  };
  const goHome = () => {
    setView('landing');
    setJobId(null);
    setTasting(null);
    setDrawerFinding(null);
    setCorkOpen(false);
  };

  return (
    <>
      <SiteHeader onHome={goHome} tweaks={tweaks} view={view} />
      {view === 'landing' && <Landing onScan={startScan} tweaks={tweaks} rateLimitMsg={rateLimitMsg} />}
      {view === 'scanning' && (
        <Scanning
          repoSlug={repoSlug}
          jobId={jobId}
          onDone={finishScan}
          onCancel={goHome}
          onError={(msg) => { setRateLimitMsg(msg); setView('landing'); }}
          tweaks={tweaks}
        />
      )}
      {view === 'tasting' && tasting && (
        <TastingResult
          tasting={tasting}
          jobId={jobId}
          tweaks={tweaks}
          onBack={goHome}
          onOpenDrawer={(id) => setDrawerFinding(id || tasting.findings[0]?.id)}
          onOpenCork={() => setCorkOpen(true)}
        />
      )}
      {view === 'tasting' && tasting && drawerFinding && (
        <VineyardDrawer tasting={tasting} openId={drawerFinding} onClose={() => setDrawerFinding(null)} />
      )}
      {view === 'tasting' && tasting && corkOpen && (
        <CorkModal tasting={tasting} jobId={jobId} tweaks={tweaks} onClose={() => setCorkOpen(false)} />
      )}
      <SiteFooter />
      {tweaksOpen && <TweaksPanel tweaks={tweaks} setTweaks={(next) => {
        const changed = {};
        Object.keys(next).forEach(k => { if (next[k] !== tweaks[k]) changed[k] = next[k]; });
        setTweaks(next);
        if (Object.keys(changed).length) {
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: changed }, '*');
        }
      }} onClose={() => setTweaksOpen(false)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
