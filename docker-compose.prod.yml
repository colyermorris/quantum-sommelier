# Production override: bind container port to loopback only.
# nginx on the host terminates TLS and reverse-proxies to 127.0.0.1:8080.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  quantum-sommelier:
    ports: !override
      - "127.0.0.1:8080:8080"
