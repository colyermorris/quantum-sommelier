; Supervisor config — runs redis-server, uvicorn, and the celery worker
; under a single container. Logs tail to stdout/stderr so `docker logs` works.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
command=/usr/bin/redis-server --save "" --appendonly no --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=uvicorn backend.main:app --host 0.0.0.0 --port 8080 --workers 1 --proxy-headers
directory=/app
autostart=true
autorestart=true
priority=30
environment=PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=celery -A backend.celery_app.celery worker --loglevel=info --concurrency=2 --pool=prefork
directory=/app
autostart=true
autorestart=true
priority=20
environment=PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock
